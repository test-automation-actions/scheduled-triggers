name: Downstream Pipeline

on:
  workflow_run:
    workflows: 
      - Pipeline 1 - Build
      - Pipeline 2 - Build
      - Pipeline 3 - Build
    types:
      - completed

jobs:
  deploy-job:
    if: >
      (github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'develop') &&
      github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest

    steps:
      # - name: Find PR from commit
      #   id: find_pr
      #   uses: actions/github-script@v7
      #   with:
      #     script: |
      #       const sha = context.payload.workflow_run.head_sha;

      #       const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
      #         owner: context.repo.owner,
      #         repo: context.repo.repo,
      #         commit_sha: sha
      #       });

      #       if (!prs || prs.length === 0) {
      #         core.setOutput("run", "false");
      #         return;
      #       }

      #       for (const pr of prs) {
      #         if (
      #           pr.merged_at &&
      #           pr.head.ref === 'develop' &&
      #           pr.base.ref.startsWith('release-')
      #         ) {
      #           console.log(`Matched merged PR #${pr.number}`);
      #           core.setOutput("run", "true");
      #           return;
      #         }
      #       }

      #       core.setOutput("run", "false");
      - name: Find PR
        id: find_pr
        uses: actions/github-script@v7
        with:
          script: |
            const source = 'develop';
            const prefix = 'release-';

            const branch = context.payload.workflow_run?.head_branch;

            console.log(`Workflow triggered from branch: ${branch}`);

            let shouldRun = false;

            // Get recently closed PRs (includes merged)
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "closed",
              per_page: 1
            });

            for (const pr of prs) {
              console.log(`Checking PR: ${pr.head.ref} -> ${pr.base.ref}, merged: ${pr.merged_at}`);

              if (
                pr.merged_at &&
                pr.head.ref === source &&
                pr.base.ref.startsWith(prefix)
              ) {
                shouldRun = true;
                console.log(`✅ Match found: PR #${pr.number}`);
                break;
              }
            }

            core.setOutput("run", shouldRun.toString());

      - name: Print triggering pipeline name
        if: steps.find_pr.outputs.run == 'true'
        run: |
          echo "Triggered by pipeline: ${{ github.event.workflow_run.name }}"
          echo "Branch: ${{ github.event.workflow_run.head_branch }}"
          echo "Event: ${{ github.event.workflow_run.event }}"
      
      - name: Dump workflow_run
        run: echo '${{ toJson(github.event.workflow_run) }}'

      - name: Dump github event
        run: echo '${{ toJson(github.event) }}'
