name: Downstream Pipeline

on:
  workflow_run:
    workflows: 
      - Pipeline 1 - Build
      - Pipeline 2 - Build
      - Pipeline 3 - Build
    types:
      - completed

jobs:
  deploy-job:
    # if: >
    #   (github.event.workflow_run.conclusion == 'success' &&
    #   startsWith(github.event.workflow_run.head_branch, 'develop') &&
    #   github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR Merge
        id: validate
        uses: actions/github-script@v7
        with:
          script: |
            const prs = context.payload.workflow_run.pull_requests;

            if (!prs || prs.length === 0) {
              core.setOutput("run", "false");
              return;
            }

            for (const pr of prs) {
              const { data } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number
              });

              if (
                data.merged === true &&
                data.head.ref === 'develop' &&
                data.base.ref.startsWith('release-')
              ) {
                console.log(`Matched merged PR #${pr.number}`);
                core.setOutput("run", "true");
                return;
              }
            }

            core.setOutput("run", "false");

      - name: Print triggering pipeline name
        if: steps.validate.outputs.run == 'true'
        run: |
          echo "Triggered by pipeline: ${{ github.event.workflow_run.name }}"
          echo "Branch: ${{ github.event.workflow_run.head_branch }}"
          echo "Event: ${{ github.event.workflow_run.event }}"
      
      - name: Dump workflow_run
        run: echo '${{ toJson(github.event.workflow_run) }}'

      - name: Dump github event
        run: echo '${{ toJson(github.event) }}'
